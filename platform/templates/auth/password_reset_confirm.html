{% extends 'base.html' %}{% block title %}Choose password{% endblock %}{% block content %}
<div class="public-card"><div class="public-logo">attendly<span>.</span></div>{% if validlink %}<h1>Choose a new password</h1><form method="post" class="stack-form">{% csrf_token %}{{ form.as_div }}<button class="btn btn-primary" type="submit">Update password</button></form>{% else %}<h1>Invalid reset link</h1><p>Request a fresh password reset email.</p><a href="{% url 'password_reset' %}" class="text-link">Request new link</a>{% endif %}</div>{% endblock %}
